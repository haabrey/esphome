substitutions:
  name: garage-ble-tracker
  friendly_name: Garage BLE Tracker

packages:
  base: !include common/base.yaml
  ble: !include common/ble.yaml
  wifi: !include common/wifi.yaml
    
# -----------------------

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  framework:
    type: esp-idf
    version: recommended
    sdkconfig_options:
      CONFIG_ESP_TASK_WDT_TIMEOUT_S: "10"

api:
  encryption:
    key: !secret garage_ble_tracker_api

ota:
  - platform: esphome
    id: !extend ota_esphome
    encryption: !remove
    password: !secret garage_ble_tracker_ota
    
logger:
  baud_rate: 0 # disables serial logging
  
binary_sensor:
  - platform: ble_presence
    mac_address: !secret mac_trash
    icon: mdi:trash-can
    name: "Trash Can"

  - platform: ble_presence
    mac_address: !secret mac_recycle
    icon: mdi:recycle
    name: "Recycle Bin"

sensor:
  # median value over 60 seconds, transmit every 60 seconds
  - platform: ble_rssi
    mac_address: !secret mac_trash
    name: "Trash Can RSSI Value"
    filters: 
      - median:
          window_size: 60
          send_every: 60
  - platform: ble_rssi
    mac_address: !secret mac_recycle
    name: "Recycle Bin RSSI Value"
    filters: 
      - median:
          window_size: 60
          send_every: 60
