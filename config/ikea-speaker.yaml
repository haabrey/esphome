# Seeed XIAO ESP32S3 with MAX98357A, IKEA speaker enclosure
# Play button: short press = volume down, long press = play/pause.
# BT button:   short press = volume up, long press = next favorite radio station
#              (sent to Home Assistant as an event, see packages/ikea_speaker_radio.yaml).
# Pinout:
#                  GPIO 1     5V      --> Amp
#                  GPIO 2     GND     --> Amp
#                  GPIO 3     3V3     --> Buttons
#  Play Button <-- GPIO 4     GPIO 9  --> BCLK
#                  GPIO 5     GPIO 8  --> DIN
#                  GPIO 6     GPIO 7  --> LRC
#   BT Button <-- GPIO 43     GPIO 44 

substitutions:
  name: ikea-speaker
  friendly_name: IKEA Speaker
  pin_i2s_dout: GPIO08
  pin_i2s_bclk: GPIO09
  pin_i2s_lrclk: GPIO07

packages:
  base: !include common/base.yaml
  wifi: !include common/wifi.yaml
  sendspin_speaker: !include common/sendspin_speaker.yaml
  board: !include common/boards/xiao-esp32s3.yaml
  

# ---- Hardware Button setup
event:
  - platform: template
    id: bt_long_press_event
    name: "BT Long Press"
    event_types:
      - long_press

binary_sensor:
  # Buttons connect the pin to 3V3, so they are active-high with a pulldown.
  - platform: gpio
    id: play_button
    internal: true
    pin:
      number: GPIO04
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_click:
      # Short press: fires on release if held less than 0.5s
      - min_length: 50ms
        max_length: 499ms
        then:
          - media_player.volume_down: external_media_player
    on_multi_click:
      # Long press: fires once the button has been held 0.5s
      # without waiting for release
      - timing:
          - ON for at least 0.5s
        then:
          - media_player.toggle: external_media_player
 
  - platform: gpio
    id: bt_button
    internal: true
    pin:
      number: GPIO43
      mode:
        input: true
        pulldown: true
    filters:
      - delayed_on: 30ms
      - delayed_off: 30ms
    on_click:
      # Short press: fires on release if held less than 0.5 s
      - min_length: 50ms
        max_length: 499ms
        then:
          - media_player.volume_up: external_media_player
    on_multi_click:
      # Long press: fires once the button has been held 0.5 s, without waiting for release
      - timing:
          - ON for at least 0.5s
        then:
          - event.trigger:
              id: bt_long_press_event
              event_type: long_press
 