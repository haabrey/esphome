substitutions:
  # Higher value gives lower watt readout
  current_res: "0.001"
  # Lower value gives lower voltage readout
  voltage_div: "770"
  update_time: 10s
  name: wyze-outdoor-plug
  friendly_name: Wyze Outdoor Plug

packages:
  base: !include common/base.yaml
  wifi: !include common/wifi.yaml

# -----------------------------

esp32:
  board: esp32dev
  framework:
    type: esp-idf
    
esp32_ble_tracker:
  scan_parameters:
    active: true

bluetooth_proxy:
  active: true

switch:
  - platform: gpio
    name: "Relay1"
    pin:
      number: GPIO15
      inverted: false
    id: relay1
    on_turn_on:
      - light.turn_on: relay1_led
    on_turn_off:
      - light.turn_off: relay1_led
  - platform: gpio
    name: "Relay2"
    pin:
      number: GPIO32
      inverted: false
    id: relay2
    on_turn_on:
      - light.turn_on: relay2_led
    on_turn_off:
      - light.turn_off: relay2_led

output:
  - platform: gpio
    pin: GPIO19
    inverted: True
    id: relay1_led_gpio
  - platform: gpio
    pin: GPIO16
    inverted: True
    id: relay2_led_gpio

light:
  - platform: binary
    name: "Relay1 LED"
    id: relay1_led
    internal: true
    output: relay1_led_gpio
  - platform: binary
    name: "Relay2 LED"
    id: relay2_led
    internal: true
    output: relay2_led_gpio
    
sensor:
  - platform: adc
    internal: true
    pin: GPIO34
    name: LUX
    id: lux_sensor
    update_interval: 10s
    attenuation: 12db
  - platform: hlw8012
    sel_pin:
      number: GPIO25
      inverted: true
    cf_pin: GPIO27
    cf1_pin: GPIO26
    current_resistor: ${current_res}
    voltage_divider: ${voltage_div}
    change_mode_every: 3
    update_interval: 3s
    current:
      name: "Amps"
      unit_of_measurement: A
      accuracy_decimals: 2
      device_class: current
      state_class: measurement
    voltage:
      name: "Volts"
      unit_of_measurement: V
      accuracy_decimals: 1
      device_class: voltage
      state_class: measurement
    power:
      id: power_w
      name: "Watts"
      unit_of_measurement: W
      accuracy_decimals: 0
      device_class: power
      state_class: measurement
      filters:
        - calibrate_linear:
            - 0.0 -> 0.0
            - 134 -> 58
  - platform: total_daily_energy
    name: "Total Energy"
    power_id: power_w
    unit_of_measurement: kWh
    device_class: energy
    state_class: total_increasing
    accuracy_decimals: 3
    filters:
      - multiply: 0.001   # W·h -> kWh
        
binary_sensor:
  - platform: gpio
    internal: true
    pin:
      number: GPIO18
      mode: INPUT_PULLDOWN
      inverted: True
    name: "Button1"
    on_press:
      - switch.toggle: relay1
  - platform: gpio
    internal: true
    pin:
      number: GPIO17
      mode: INPUT_PULLDOWN
      inverted: True
    name: "Button2"
    on_press:
      - switch.toggle: relay2
  - platform: template
    name: "Daylight"
    device_class: light
    lambda: |-
        if (id(lux_sensor).state > 2) {
          return true;
        } else {
          return false;
        }

status_led:
  pin:
    number: GPIO5
    inverted: true