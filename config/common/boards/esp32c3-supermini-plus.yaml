# ESP32-C3 Super Mini Plus (red PCB)
# https://www.espboards.dev/esp32/esp32-c3-super-mini-plus/
#
# - ESP32-C3 (RISC-V, 160 MHz), 4 MB flash, 400 KB SRAM, WiFi + BLE 5,
#   USB-C with native USB.
# - Onboard LEDs: red power LED (not controllable), blue user LED and a
#   WS2812 RGB LED, both on GPIO8. They share the pin and can't be used
#   reliably at the same time; use the RGB light only.
# - Safe GPIOs with no boot/system role: 0, 1, 3, 10
# - Strapping pins: 2, 4, 5, 6, 7, 8, 9 (GPIO8 must be HIGH at reset,
#   GPIO9 LOW at reset = download mode)
# - GPIO20/21 are UART0 RX/TX. I2C default is SDA=GPIO8, SCL=GPIO9.
# - Antenna: u.FL connector (solder the jumper pad to enable the external
#   antenna), much better range than the standard board's ceramic antenna.

esp32:
  board: esp32-c3-devkitm-1
  variant: ESP32C3
  flash_size: 4MB
  framework:
    type: esp-idf

logger:
  hardware_uart: USB_SERIAL_JTAG

light:
  - platform: esp32_rmt_led_strip
    name: "Onboard RGB LED"
    id: onboard_rgb
    pin: GPIO8
    num_leds: 1
    chipset: WS2812
    rgb_order: GRB
