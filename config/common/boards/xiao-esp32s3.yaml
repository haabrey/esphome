# Seeed Studio XIAO ESP32S3
# https://www.espboards.dev/esp32/xiao-esp32s3/
#
# - ESP32-S3R8 (dual-core Xtensa LX7, 240 MHz), 8 MB flash, 8 MB octal PSRAM,
#   512 KB SRAM, WiFi 802.11b/g/n + BLE 5, USB-C with native USB (no UART
#   bridge chip). 21 x 17.8 mm, 11 GPIO broken out.
# - PSRAM is octal and must be enabled (psram: mode: octal) or it isn't there.
# - Onboard LEDs: user LED on GPIO21 (active-low, lights when driven LOW) and
#   a red charge LED (battery charger, not controllable).
# - Battery: solder pads for a 3.7 V LiPo, onboard charger at 50 mA fast /
#   3.8 mA trickle. Deep sleep is about 14 uA.
# - Safe GPIOs with no boot/system role: 1, 2, 4, 5, 6, 7, 8
# - Use with care: GPIO3 (strapping, selects JTAG source), GPIO9 (SPI2/FSPI
#   hold/data line, only taken if something else is wired to FSPI),
#   GPIO43/44 (UART0 TX/RX, serial console and UART download mode)
# - Default buses: I2C SDA=GPIO5, SCL=GPIO6; SPI MOSI=GPIO9, MISO=GPIO8,
#   SCK=GPIO7; UART TX=GPIO43, RX=GPIO44
# - ADC on GPIO1-9 (D0-D5, D8-D10), touch on the same pins, PWM on every GPIO
# - Antenna: u.FL socket. A 2.4 GHz FPC antenna (Seeed A-02) is in the box;
#   attach it for decent range.

esp32:
  board: seeed_xiao_esp32s3
  variant: esp32s3
  flash_size: 8MB
  framework:
    type: esp-idf

psram:
  mode: octal
  speed: 80MHz

logger:
  hardware_uart: USB_SERIAL_JTAG   # keeps UART0 (GPIO43/44) free

output:
  - platform: gpio
    pin:
      number: GPIO21
      inverted: true   # user LED lights when driven LOW
    id: user_led

light:
  - platform: binary
    name: "User LED"
    id: user_led_light
    output: user_led
